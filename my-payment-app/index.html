<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay Now</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f6fb;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .payment-card {
      width: 100%;
      max-width: 524px;
      background: #ffffff;
      border-radius: 23px;
      padding: 37px 36px 55px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.07);
    }

    .heading {
      text-align: center;
      margin-bottom: 32px;
    }

    .heading h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.2;
      font-weight: 700;
      color: #090909;
      letter-spacing: -1px;
    }

    .heading p {
      margin: 10px 0 0;
      font-size: 21px;
      color: #777777;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 23px;
    }

    .form-group label {
      display: block;
      font-size: 20px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 11px;
    }

    .form-group input {
      width: 100%;
      height: 64px;
      border: 1px solid #d8d8d8;
      border-radius: 15px;
      padding: 0 19px;
      font-size: 20px;
      color: #222222;
      outline: none;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input::placeholder {
      color: #858585;
      opacity: 1;
    }

    .form-group input:focus {
      border-color: #6335e8;
      box-shadow: 0 0 0 3px rgba(99, 53, 232, 0.10);
    }

    .pay-button {
      width: 100%;
      height: 65px;
      margin-top: 5px;
      border: none;
      border-radius: 14px;
      background: #6035e6;
      color: white;
      font-size: 21px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .pay-button:hover {
      background: #5126d2;
    }

    .pay-button:active {
      transform: scale(0.99);
    }

    @media (max-width: 600px) {
      body {
        padding: 25px;
      }

      .payment-card {
        max-width: 100%;
        border-radius: 22px;
        padding: 37px 36px 55px;
      }

      .heading h1 {
        font-size: 40px;
      }

      .heading p {
        font-size: 21px;
      }

      .form-group label {
        font-size: 20px;
      }

      .form-group input {
        height: 64px;
        font-size: 20px;
      }

      .pay-button {
        height: 65px;
        font-size: 21px;
      }
    }

    @media (max-width: 400px) {
      body {
        padding: 18px;
      }

      .payment-card {
        padding: 32px 25px 42px;
      }

      .heading h1 {
        font-size: 32px;
      }

      .heading p {
        font-size: 17px;
      }

      .form-group label {
        font-size: 17px;
      }

      .form-group input {
        height: 58px;
        font-size: 17px;
      }

      .pay-button {
        height: 60px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="payment-card">

    <div class="heading">
      <h1>Make Payment</h1>
      <p>Enter your details to continue</p>
    </div>

    <form id="paymentForm">

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input
          type="tel"
          id="mobile"
          placeholder="Enter mobile number"
          maxlength="10"
          required
        />
      </div>

      <div class="form-group">
        <label for="amount">Amount</label>
        <input
          type="number"
          id="amount"
          placeholder="Enter amount"
          min="1"
          required
        />
      </div>

      <button type="submit" class="pay-button">
        Pay Now
      </button>

    </form>

  </div>

  <script>
    document.getElementById("paymentForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const mobile = document.getElementById("mobile").value;
      const amount = document.getElementById("amount").value;

      if (mobile.length !== 10) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
      }

      if (!amount || amount <= 0) {
        alert("Please enter a valid amount.");
        return;
      }

      alert("Payment details submitted!");
    });
  </script>

</body>
</html>
