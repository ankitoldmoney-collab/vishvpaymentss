<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Make a Payment</h2>
        <input type="number" id="amount" placeholder="Enter Amount (INR)" value="100">
        <button onclick="makePayment()">Pay Now</button>
        <p id="message"></p>
    </div>

    <script>
        async function makePayment() {
            const amount = document.getElementById('amount').value;
            const message = document.getElementById('message');
            
            message.style.color = "blue";
            message.innerText = "Processing...";

            try {
                const response = await fetch('/api.js', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ amount: amount })
                });

                const data = await response.json();
                
                if (response.ok) {
                    message.style.color = "green";
                    message.innerText = "Success: " + (data.message || "Payment initiated!");
                } else {
                    message.style.color = "red";
                    message.innerText = "Error: " + (data.error || "Something went wrong");
                }
            } catch (error) {
                message.style.color = "red";
                message.innerText = "Network Error!";
            }
        }
    </script>

</body>
</html>
