<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Payment</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        h2 {
            font-size: 26px;
            font-weight: 700;
            color: #111;
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #111;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #5b35ed;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #5b35ed;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4c2ad4;
        }
        button:disabled {
            background-color: #a593f5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Make Payment</h2>
        <p class="subtitle">Enter your details to continue</p>
        
        <form id="paymentForm">
            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="tel" id="mobileNumber" placeholder="Enter mobile number" required pattern="[0-9]{10}">
            </div>
            
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount" required min="10">
            </div>
            
            <button type="submit" id="payButton">Pay Now</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('paymentForm');
        const payButton = document.getElementById('payButton');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const mobileNumber = document.getElementById('mobileNumber').value;
            const amount = document.getElementById('amount').value;

            payButton.disabled = true;
            payButton.innerText = 'Processing...';

            try {
                const response = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mobileNumber, amount })
                });

                const data = await response.json();

                if (data.success && data.cashierUrl) {
                    // BladePay ke Cashier URL par redirect kar dega
                    window.location.href = data.cashierUrl;
                } else {
                    alert('Error: ' + (data.message || 'Something went wrong'));
                    payButton.disabled = false;
                    payButton.innerText = 'Pay Now';
                }
            } catch (err) {
                console.error(err);
                alert('Network error. Please try again.');
                payButton.disabled = false;
                payButton.innerText = 'Pay Now';
            }
        });
    </script>
</body>
</html>
